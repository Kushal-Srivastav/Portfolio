<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background with gradient -->
    <rect width="800" height="600" rx="20" fill="url(#grad1)"/>
    
    <!-- Main medical cross symbol -->
    <g transform="translate(350, 150)">
        <rect x="-15" y="-40" width="30" height="80" rx="5" fill="#4CAF50"/>
        <rect x="-40" y="-15" width="80" height="30" rx="5" fill="#4CAF50"/>
    </g>
    
    <!-- Medical interface elements -->
    <rect x="100" y="150" width="200" height="300" rx="15" fill="#FFFFFF" opacity="0.1"/>
    <rect x="120" y="170" width="160" height="30" rx="5" fill="#4CAF50" opacity="0.8"/>
    <rect x="120" y="220" width="160" height="10" rx="5" fill="#FFFFFF" opacity="0.3"/>
    <rect x="120" y="240" width="160" height="10" rx="5" fill="#FFFFFF" opacity="0.3"/>
    <rect x="120" y="260" width="160" height="10" rx="5" fill="#FFFFFF" opacity="0.3"/>
    
    <!-- Heart rate monitor line -->
    <path d="M500 250 L520 250 L530 200 L540 300 L550 250 L570 250" 
          stroke="#FF5252" 
          stroke-width="3"
          fill="none"/>
    
    <!-- Circular medical icons -->
    <circle cx="600" cy="150" r="40" fill="#2196F3" opacity="0.8"/>
    <text x="585" y="165" font-family="Arial" font-size="40" fill="white">💊</text>
    
    <circle cx="700" cy="250" r="40" fill="#9C27B0" opacity="0.8"/>
    <text x="685" y="265" font-family="Arial" font-size="40" fill="white">🏥</text>
    
    <!-- Medical data points -->
    <circle cx="150" cy="400" r="5" fill="#4CAF50"/>
    <circle cx="180" cy="380" r="5" fill="#4CAF50"/>
    <circle cx="210" cy="420" r="5" fill="#4CAF50"/>
    <path d="M150 400 L180 380 L210 420" stroke="#4CAF50" stroke-width="2" opacity="0.5"/>
    
    <!-- Gradient definition -->
    <defs>
        <linearGradient id="grad1" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
            <stop offset="0%" style="stop-color:#1A1B2E"/>
            <stop offset="100%" style="stop-color:#2A2B3D"/>
        </linearGradient>
    </defs>
</svg> 