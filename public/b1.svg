<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="800" height="600" fill="#0A1128"/>
    
    <!-- Desk -->
    <rect x="150" y="400" width="500" height="20" rx="5" fill="#2A2B3D"/>
    
    <!-- Person -->
    <g transform="translate(350, 300)">
        <rect x="-30" y="-50" width="60" height="100" rx="15" fill="#3F4154"/>
        <circle cx="0" cy="-70" r="25" fill="#3F4154"/>
    </g>
    
    <!-- Laptop -->
    <g transform="translate(400, 300)">
        <rect x="-100" y="-80" width="200" height="130" rx="8" fill="#1E1F2E"/>
        <rect x="-90" y="-70" width="180" height="110" rx="4" fill="#2A2B3D"/>
        
        <!-- Code lines -->
        <rect x="-70" y="-60" width="60" height="4" rx="2" fill="#4CAF50"/>
        <rect x="-70" y="-50" width="100" height="4" rx="2" fill="#4CAF50" opacity="0.8"/>
        <rect x="-70" y="-40" width="80" height="4" rx="2" fill="#4CAF50" opacity="0.6"/>
    </g>
    
    <!-- AI Elements -->
    <g transform="translate(550, 180)">
        <circle cx="0" cy="0" r="4" fill="#6C63FF"/>
        <circle cx="20" cy="-15" r="4" fill="#6C63FF"/>
        <circle cx="-15" cy="20" r="4" fill="#6C63FF"/>
        <line x1="0" y1="0" x2="20" y2="-15" stroke="#6C63FF"/>
        <line x1="0" y1="0" x2="-15" y2="20" stroke="#6C63FF"/>
    </g>
    
    <!-- Tech Icon -->
    <g transform="translate(200, 180)">
        <rect x="-15" y="-15" width="30" height="30" rx="8" fill="#6C63FF" opacity="0.2"/>
        <text x="0" y="5" font-family="Arial" font-size="16" fill="#6C63FF" text-anchor="middle">AI</text>
    </g>
</svg> 